name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for release (e.g. v1.1.0)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release with APK?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Run tests
        run: flutter test || true

      # ── بناء APK العادي (universal) ──
      - name: Build APK universal release
        run: flutter build apk --release --verbose

      # ── بناء APK مقسمة حسب المعمارية (أصغر حجماً) ──
      - name: Build APK split per ABI (arm64, armv7, x64)
        run: flutter build apk --release --split-per-abi --verbose

      # ── بناء نسخة 64-bit فقط (أصغر حجم ممكن) ──
      - name: Build APK arm64-v8a only (64-bit smallest)
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Prepare artifacts & list sizes
        run: |
          echo "=== APKs built ==="
          ls -lh build/app/outputs/flutter-apk/
          echo ""
          mkdir -p dist
          # نسخ كل الـ APKs إلى dist
          cp build/app/outputs/flutter-apk/*.apk dist/ || true
          ls -lh dist/
          echo ""
          echo "=== Sizes ==="
          du -h dist/*.apk
          # نسخ مع أسماء عربية ومبسطة
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/dalel-arm64.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/دليل-الدير-arm64.apk" || true
          cp build/app/outputs/flutter-apk/app-release.apk dist/dalel-release.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk "dist/دليل-الدير.apk" || true
          # معلومات البناء
          echo "Build: ${{ github.run_number }}" > dist/build-info.txt
          echo "Commit: ${{ github.sha }}" >> dist/build-info.txt
          echo "Date: $(date -u)" >> dist/build-info.txt
          echo "Version: $(grep '^version:' pubspec.yaml)" >> dist/build-info.txt
          cat dist/build-info.txt
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dalel-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            dist/
          retention-days: 30

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "Using tag from ref: $TAG"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "Using input tag: ${{ inputs.release_tag }}"
          else
            VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d ' ' | tr -d "'\"")
            if [ -z "$VER" ]; then VER="1.1.0"; fi
            echo "VER=$VER"
            echo "tag=v${VER}-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi
          echo "Tag determined"

      - name: Create GitHub Release with APKs (universal + arm64)
        if: ${{ inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "دليل الدير ${{ steps.tag.outputs.tag }}"
          body: |
            ## دليل الدير - APK جاهز للتثبيت (v1.1.0)

            تم بناء هذا الإصدار تلقائياً عبر GitHub Actions من النسخة الأحدث.

            - **الحزمة:** `com.winfeen.dalel`
            - **الإصدار:** `1.1.0+2` (من pubspec.yaml)
            - **Commit:** `${{ github.sha }}`
            - **Workflow run:** `${{ github.run_number }}`

            ### 📦 الملفات المتاحة (اختر ما يناسبك)

            | الملف | الوصف | الحجم التقريبي |
            |---|---|---|
            | `app-arm64-v8a-release.apk` / `dalel-arm64.apk` | **موصى به** - يدعم 64-bit فقط (arm64-v8a) - أصغر حجماً وأسرع | ~22-25 MB |
            | `app-armeabi-v7a-release.apk` | للأجهزة القديمة 32-bit | ~21 MB |
            | `app-x86_64-release.apk` | للمحاكيات وأجهزة x86_64 | ~23 MB |
            | `app-release.apk` / `dalel-release.apk` | نسخة شاملة تدعم كل المعماريات | ~54 MB |
            | `دليل-الدير.apk` | نفس الشاملة باسم عربي | ~54 MB |
            | `دليل-الدير-arm64.apk` | نسخة 64-bit باسم عربي | ~22 MB |

            ### 🚀 التثبيت
            - للأجهزة الحديثة (2019+): حمّل `dalel-arm64.apk` (أصغر وأفضل)
            - للأجهزة القديمة: حمّل `app-armeabi-v7a-release.apk`
            - إذا لم تكن متأكداً: حمّل `app-release.apk` الشاملة

            ### ✨ الجديد في v1.1.0
            - إصلاح قراءة كل خدمات القسم (كان يقص عند 200)
            - حد محلي جديد 5000 بدلاً من 200
            - عرض طلبات بانتظار موافقة المدير
            - تحسينات المزامنة (إزالة حاجز 10 دقائق)
            - اختبارات جديدة

            ### المميزات العامة
            - تصفح بدون إنترنت (SQLite محلي)
            - بحث وفلترة
            - لوحة تحكم المالك
            - دعم RTL كامل
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            dist/dalel-release.apk
            dist/dalel-arm64.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
